name: spacecmu # You can also change this to another name to avoid warning with existing group. 
services:
  frontend:
    container_name: frontend
    build: .
    ports:
      - ${NGINX_PORT}:5173
    networks:
      - spacecmu_spacecmu-net
    environment:
      - NGINX_PROXY=${NGINX_PROXY}
      - NGINX_PORT=${NGINX_PORT}
networks:
  spacecmu_spacecmu-net: # Check by using `docker network ls` command
    external: true