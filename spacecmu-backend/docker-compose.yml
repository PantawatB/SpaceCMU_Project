name: spacecmu

services:
  postgres:
    image: postgres:17-alpine
    container_name: database
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/_entrypoint:/docker-entrypoint-initdb.d
    environment:
      - TZ=UTC
      - PGTZ=UTC
    networks:
      - spacecmu-net
    env_file:
      - ./.env

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - POSTGRES_HOST=database
      - NODE_ENV=development
      - PORT=3001
      - TZ=UTC
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - spacecmu-net
    command: /app/scripts/docker-entrypoint.sh
    depends_on:
      - postgres
    env_file:
      - ./.env

networks:
  spacecmu-net:
    driver: bridge

volumes:
  db_data:
